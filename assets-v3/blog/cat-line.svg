  </g>
  <text x="64" y="218" font-family="'Noto Sans JP', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">LINE構築</text>
  <text x="64" y="258" font-family="'Noto Sans JP', sans-serif" font-size="18" fill="#C7DBFB">公式LINEを「仕組み」にする方法</text>
