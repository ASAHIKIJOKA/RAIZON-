    <rect x="98" y="134" width="170" height="40" rx="14" fill="#06C755"/>
    <text x="114" y="159" font-family="'Noto Sans JP',sans-serif" font-size="14" fill="#FFFFFF">空き枠はこちらです</text>

    <rect x="24" y="192" width="60" height="34" rx="10" fill="#FFFFFF" stroke="#146EF5" stroke-width="2"/>
    <text x="54" y="214" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#146EF5">13:00</text>
    <rect x="92" y="192" width="60" height="34" rx="10" fill="#146EF5"/>
    <text x="122" y="214" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">14:00</text>
    <rect x="160" y="192" width="60" height="34" rx="10" fill="#FFFFFF" stroke="#146EF5" stroke-width="2"/>
    <text x="190" y="214" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#146EF5">15:30</text>

    <rect x="24" y="248" width="244" height="30" rx="15" fill="#EEF4FE"/>
