<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C7CFB"/>
      <stop offset="100%" stop-color="#0A2559"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <circle cx="700" cy="40" r="230" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="40" cy="430" r="160" fill="#06C755" opacity="0.08"/>

  <!-- device card: LINE chat mockup -->
  <g transform="translate(430,64)">
    <rect x="6" y="10" width="292" height="300" rx="26" fill="#0B2E6B" opacity="0.35"/>
    <rect width="292" height="300" rx="26" fill="#FFFFFF"/>
    <rect x="0" y="0" width="292" height="54" rx="26" fill="#F5F7FA"/>
    <rect x="0" y="28" width="292" height="26" fill="#F5F7FA"/>
    <circle cx="34" cy="27" r="14" fill="#06C755"/>
    <path d="M27 24 h14 v9 h-14 z" fill="#FFFFFF" opacity="0"/>
    <text x="58" y="32" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" fill="#111827">公式アカウント</text>

    <rect x="24" y="80" width="170" height="40" rx="14" fill="#F5F7FA"/>
